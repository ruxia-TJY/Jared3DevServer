<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}UpdateHub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ url_for('web.index') }}" class="site-logo">
        <span class="logo-icon">⬆</span>
        UpdateHub
      </a>
      <nav class="site-nav">
        <a href="{{ url_for('web.index') }}">软件列表</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>UpdateHub · 软件更新分发服务</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
