{% extends "base.html" %}

{% block title %}编辑 {{ api.name }} · API 管理 · UpdateHub{% endblock %}

{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('apistack.manage') }}">API 管理</a>
  <span>/</span>
  <span>编辑</span>
</div>

<div class="page-header">
  <h1>编辑 API <code class="api-name" style="font-size:1.3rem;">{{ api.name }}</code></h1>
</div>

<form method="post" class="user-form" style="max-width:700px;">

  {# 名称只读，不可修改（影响 URL 与处理函数注册） #}
  <div class="form-group">
    <label class="form-label">名称 <span class="form-optional">（URL slug，不可修改）</span></label>
    <input class="form-input" value="{{ api.name }}" disabled>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label">显示名称</label>
      <input class="form-input" name="display_name" required value="{{ api.display_name }}">
    </div>
    <div class="form-group">
      <label class="form-label">版本</label>
      <input class="form-input" name="version" required value="{{ api.version }}">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label">作者 <span class="form-optional">（可选）</span></label>
      <input class="form-input" name="author" value="{{ api.author or '' }}">
    </div>
    <div class="form-group">
      <label class="form-label">公开性</label>
      <select class="form-input" name="visibility">
        <option value="public"  {% if api.visibility == 'public'  %}selected{% endif %}>公开（任何人可访问）</option>
        <option value="private" {% if api.visibility == 'private' %}selected{% endif %}>私有（需 Token 访问）</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">描述 <span class="form-optional">（可选）</span></label>
    <input class="form-input" name="description" value="{{ api.description or '' }}"
           placeholder="简短描述此 API 的功能">
  </div>

  <div class="form-group">
    <label class="form-label">状态</label>
    <div style="display:flex;gap:20px;padding-top:4px;">
      <label class="form-check">
        <input type="radio" name="enabled" value="1" {% if api.enabled %}checked{% endif %}>
        启用
      </label>
      <label class="form-check">
        <input type="radio" name="enabled" value="0" {% if not api.enabled %}checked{% endif %}>
        禁用
      </label>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">
      使用文档 <span class="form-optional">（可选，支持 Markdown）</span>
    </label>
    <textarea class="form-input doc-editor" name="doc_content" rows="14"
              placeholder="## 接口说明&#10;&#10;描述 API 的参数、返回值、示例等...">{{ api.doc_content or '' }}</textarea>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">保存修改</button>
    <a href="{{ url_for('apistack.manage') }}" class="btn btn-sm">取消</a>
    {% if api.doc_content %}
    <a href="{{ url_for('apistack.api_doc_detail', api_name=api.name) }}"
       target="_blank" style="margin-left:auto;font-size:.875rem;color:var(--primary);">预览文档 ↗</a>
    {% endif %}
  </div>

</form>
{% endblock %}
